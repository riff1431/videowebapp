services:
  postgres:
    image: postgres:16-alpine
    container_name: playtube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playtube
      POSTGRES_PASSWORD: playtubepassword
      POSTGRES_DB: playtube
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtube -d playtube"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
